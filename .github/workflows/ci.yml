name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile every script
        run: python -m py_compile scripts/*.py

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      # Oldest supported Python — the README promises 3.9+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Test suite on Python 3.9
        run: python -m unittest discover -s tests -v
