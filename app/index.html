<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Superlearn</title>
<style>
  /* ══════════════════════════════════════════════════════════════════
     Theme system. Each board declares {"theme":{"preset":..,"accent":..}}
     and Claude Code picks the identity that fits the subject. The ink-*
     scale is semantic (950 = deepest background → 100 = strongest text),
     so light themes simply invert it. Accent derivatives are computed
     with color-mix, so a custom accent recolors the whole page.
     ══════════════════════════════════════════════════════════════════ */
  :root {
    --accent: #7c5cff;
    --accent-soft: color-mix(in srgb, var(--accent) 62%, var(--ink-100));
    --accent-glow: color-mix(in srgb, var(--accent) 72%, var(--ink-950));
    --accent-dim: color-mix(in srgb, var(--accent) 16%, transparent);
    --accent-sel: color-mix(in srgb, var(--accent) 40%, transparent);
    --coral: #ff6b6b; --mint: #3ddc97; --gold: #ffc857; --sky: #4cc9f0;
    --radius: 16px;
    --font-body: "Avenir Next", Avenir, "Segoe UI", Inter, system-ui, sans-serif;
    --font-display: var(--font-body);
    --font-mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --shadow-card: 0 14px 44px -14px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  [data-theme="midnight"] {
    color-scheme: dark;
    --ink-950: #0b0b10; --ink-900: #12121a; --ink-850: #171724; --ink-800: #1d1d2b;
    --ink-700: #2a2a3d; --ink-600: #3d3d55; --ink-400: #8a8aa3; --ink-300: #b0b0c4;
    --ink-200: #d4d4e2; --ink-100: #ececf4;
    --accent: #7c5cff;
    --bg-image: radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
                radial-gradient(900px 500px at -10% 30%, rgba(76,201,240,.08), transparent 55%);
  }

  [data-theme="blueprint"] {
    color-scheme: dark;
    --ink-950: #0a1628; --ink-900: #0e1d33; --ink-850: #122440; --ink-800: #1a3050;
    --ink-700: #27466b; --ink-600: #3a5f8a; --ink-400: #7d9cbf; --ink-300: #a5c0dd;
    --ink-200: #cfe0f2; --ink-100: #eaf3fc;
    --accent: #4cc9f0; --gold: #ffc857; --coral: #ff8a80; --mint: #6fe3b4;
    --bg-image: linear-gradient(rgba(76,201,240,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(76,201,240,.045) 1px, transparent 1px);
    --bg-size: 32px 32px;
  }

  [data-theme="terminal"] {
    color-scheme: dark;
    --ink-950: #050806; --ink-900: #0a110c; --ink-850: #0d1710; --ink-800: #142117;
    --ink-700: #1f3325; --ink-600: #2e4a36; --ink-400: #6f9a7c; --ink-300: #93bd9f;
    --ink-200: #c0e4c8; --ink-100: #e4fbe8;
    --accent: #2fbf71; --gold: #ffb454; --coral: #ff7a70; --sky: #56d4dd; --mint: #2fbf71;
    --font-body: var(--font-mono); --font-display: var(--font-mono);
    --bg-image: repeating-linear-gradient(0deg, transparent 0 2px, rgba(47,191,113,.02) 2px 4px);
  }

  [data-theme="paper"] {
    color-scheme: light;
    --ink-950: #f4f0e6; --ink-900: #faf7ef; --ink-850: #fffdf7; --ink-800: #e5ded0;
    --ink-700: #d3c9b4; --ink-600: #b3a78c; --ink-400: #6f6754; --ink-300: #48423a;
    --ink-200: #2f2b25; --ink-100: #1a1712;
    --accent: #8a2d3b; --coral: #b4462f; --mint: #2e6e4e; --gold: #9a6a1f; --sky: #23617d;
    --accent-soft: color-mix(in srgb, var(--accent) 82%, var(--ink-100));
    --font-body: Charter, Georgia, "Times New Roman", serif;
    --font-display: Charter, Georgia, serif;
    --bg-image: none;
    --shadow-card: 0 10px 30px -14px rgba(60, 40, 20, .25);
  }

  [data-theme="sepia"] {
    color-scheme: light;
    --ink-950: #efe3cb; --ink-900: #f6ecd8; --ink-850: #fbf3e2; --ink-800: #ddcda9;
    --ink-700: #c8b489; --ink-600: #a68f61; --ink-400: #6d5c3d; --ink-300: #4c402c;
    --ink-200: #352c1e; --ink-100: #201a10;
    --accent: #9c5a1e; --coral: #a53a2a; --mint: #4f6b34; --gold: #8a6a12; --sky: #3a6273;
    --accent-soft: color-mix(in srgb, var(--accent) 82%, var(--ink-100));
    --font-body: Georgia, "Iowan Old Style", serif;
    --font-display: Georgia, serif;
    --bg-image: radial-gradient(900px 500px at 50% -10%, rgba(156,90,30,.10), transparent 60%);
    --shadow-card: 0 10px 30px -14px rgba(90, 60, 20, .3);
  }

  [data-theme="arctic"] {
    color-scheme: light;
    --ink-950: #edf1f6; --ink-900: #f5f8fb; --ink-850: #ffffff; --ink-800: #dde5ee;
    --ink-700: #c4d1e0; --ink-600: #9db0c6; --ink-400: #5d708a; --ink-300: #3d4d63;
    --ink-200: #283548; --ink-100: #16202e;
    --accent: #0f6bd7; --coral: #d64550; --mint: #0e8a6d; --gold: #b07816; --sky: #0d7f9c;
    --accent-soft: color-mix(in srgb, var(--accent) 82%, var(--ink-100));
    --font-body: "Segoe UI", Inter, system-ui, sans-serif;
    --bg-image: radial-gradient(1000px 500px at 80% -10%, rgba(15,107,215,.08), transparent 60%);
    --shadow-card: 0 10px 30px -16px rgba(20, 50, 90, .28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--ink-950);
    background-image: var(--bg-image, none);
    background-size: var(--bg-size, auto);
    background-attachment: fixed;
    color: var(--ink-200);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s ease, color .3s ease;
  }
  ::selection { background: var(--accent-sel); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--ink-950); }
  ::-webkit-scrollbar-thumb { background: var(--ink-700); border-radius: 99px; }
  a { color: var(--accent-soft); text-decoration: none; }
  a:hover { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  code, pre { font-family: var(--font-mono); }

  /* ── Chrome ─────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px;
    background: color-mix(in srgb, var(--ink-950) 84%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--ink-800);
  }
  .logo { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 19px; color: var(--ink-100); letter-spacing: -.02em; font-family: var(--font-display); }
  .logo .spark { color: var(--accent); }
  .logo small { font-size: 11px; font-weight: 500; color: var(--ink-400); letter-spacing: .12em; text-transform: uppercase; }

  select, .btn, input[type=search] {
    background: var(--ink-850); color: var(--ink-200);
    border: 1px solid var(--ink-700); border-radius: 10px;
    padding: 8px 12px; font-size: 13.5px; outline: none;
  }
  select:hover, .btn:hover { border-color: var(--ink-600); }
  input[type=search] { width: 210px; }
  input[type=search]:focus { border-color: var(--accent); }

  .views { display: flex; gap: 4px; background: var(--ink-850); border: 1px solid var(--ink-700); border-radius: 12px; padding: 4px; }
  .views button {
    background: none; border: 0; color: var(--ink-400);
    padding: 6px 13px; border-radius: 8px; font-size: 13px; font-weight: 600;
  }
  .views button.active { background: var(--accent); color: var(--ink-950); }
  .views button:hover:not(.active) { color: var(--ink-100); }
  .spacer { flex: 1; }

  /* ── Hero ───────────────────────────────────────────── */
  .hero { padding: 34px 26px 8px; max-width: 1500px; margin: 0 auto; }
  .hero h1 { font-size: clamp(26px, 4vw, 42px); color: var(--ink-100); letter-spacing: -.02em; line-height: 1.1; font-family: var(--font-display); }
  .hero h1 .emoji { margin-right: 12px; }
  .hero .meta { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--ink-400); font-size: 13px; }
  .chip { border: 1px solid var(--ink-700); background: var(--ink-850); border-radius: 99px; padding: 3px 11px; font-size: 12px; }
  .chip.accent { color: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

  main { max-width: 1500px; margin: 0 auto; padding: 22px 26px 80px; }

  /* ── Layouts ────────────────────────────────────────── */
  .masonry { column-gap: 20px; column-count: 1; }
  @media (min-width: 700px)  { .masonry { column-count: 2; } }
  @media (min-width: 1100px) { .masonry { column-count: 3; } }
  @media (min-width: 1500px) { .masonry { column-count: 4; } }
  .masonry > .card { break-inside: avoid; margin-bottom: 20px; }

  .notesflow { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
  .gridflow { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .feedflow { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  /* ── Cards ──────────────────────────────────────────── */
  .card {
    background: linear-gradient(180deg, var(--ink-850), var(--ink-900));
    border: 1px solid var(--ink-800); border-radius: var(--radius);
    padding: 20px; position: relative; overflow: hidden;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    animation: rise .45s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .card:hover { transform: translateY(-3px); border-color: var(--ink-700); box-shadow: var(--shadow-card); }
  .card::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
    background: var(--card-accent, var(--accent));
    opacity: .9;
  }
  .card .kicker {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--card-accent, var(--accent-soft));
  }
  .card h2 { color: var(--ink-100); font-size: 18px; letter-spacing: -.01em; margin-bottom: 10px; line-height: 1.25; font-family: var(--font-display); }
  .card .tagline { color: var(--ink-300); font-style: italic; margin: -4px 0 10px; font-size: 14px; }

  .notesflow .card, .feedflow .card { padding: 26px 30px; }
  .notesflow .card h2 { font-size: 22px; }

  /* ── Markdown ───────────────────────────────────────── */
  .md { font-size: 14.5px; line-height: 1.65; color: var(--ink-300); display: flex; flex-direction: column; gap: 10px; }
  .md h3, .md h4 { color: var(--ink-100); margin-top: 6px; font-size: 15px; }
  .md h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-soft); }
  .md strong { color: var(--ink-100); }
  .md code { background: var(--ink-950); border: 1px solid var(--ink-800); border-radius: 6px; padding: 1.5px 6px; font-size: .86em; color: var(--sky); }
  .md pre { background: var(--ink-950); border: 1px solid var(--ink-800); border-radius: 12px; padding: 14px; overflow-x: auto; }
  .md pre code { background: none; border: 0; padding: 0; color: var(--ink-200); font-size: 12.5px; line-height: 1.6; }
  .md ul, .md ol { padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
  .md li::marker { color: var(--accent-soft); }
  .md blockquote { border-left: 2px solid var(--accent); padding-left: 14px; font-style: italic; color: var(--ink-300); }
  .md table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .md th { text-align: left; color: var(--ink-100); border-bottom: 1px solid var(--ink-700); padding: 6px 8px; }
  .md td { border-bottom: 1px solid var(--ink-800); padding: 6px 8px; vertical-align: top; }

  /* ── Video ──────────────────────────────────────────── */
  .video-shell { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; background: #000; cursor: pointer; }
  .video-shell img { width: 100%; height: 100%; object-fit: cover; opacity: .85; transition: opacity .2s, transform .3s; }
  .video-shell:hover img { opacity: 1; transform: scale(1.03); }
  .video-shell .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .video-shell .play span {
    width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 92%, transparent); color: var(--ink-950);
    font-size: 22px; padding-left: 4px;
    box-shadow: 0 8px 30px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .video-shell iframe { width: 100%; height: 100%; border: 0; }
  .video-meta { margin-top: 10px; font-size: 12.5px; color: var(--ink-400); }
  .video-meta b { color: var(--ink-300); }

  /* ── Code block ─────────────────────────────────────── */
  .codewrap { position: relative; }
  .codewrap .lang { position: absolute; top: 10px; left: 14px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-400); }
  .codewrap .copy { position: absolute; top: 7px; right: 8px; font-size: 11px; padding: 4px 10px; border-radius: 7px; background: var(--ink-800); border: 1px solid var(--ink-700); color: var(--ink-300); }
  .codewrap .copy:hover { color: var(--ink-100); border-color: var(--accent); }
  .codewrap pre { background: var(--ink-950); border: 1px solid var(--ink-800); border-radius: 12px; padding: 34px 14px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.65; color: var(--ink-200); }

  /* ── Flashcards ─────────────────────────────────────── */
  .fc-scene { perspective: 1200px; }
  .fc-card {
    position: relative; min-height: 170px; border-radius: 14px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .fc-card.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    display: grid; place-items: center; text-align: center; padding: 22px;
    border-radius: 14px; border: 1px solid var(--ink-700);
    font-size: 15.5px; line-height: 1.5;
  }
  .fc-front { background: linear-gradient(145deg, var(--ink-800), var(--ink-850)); color: var(--ink-100); font-weight: 600; }
  .fc-back { background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 22%, var(--ink-900)), var(--ink-850)); transform: rotateY(180deg); color: var(--ink-200); }
  .fc-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
  .fc-nav .count { font-size: 12.5px; color: var(--ink-400); }
  .fc-nav .grp { display: flex; gap: 6px; }
  .fc-hint { text-align: center; font-size: 11px; color: var(--ink-400); margin-top: 8px; letter-spacing: .06em; text-transform: uppercase; }

  /* ── Roadmap ────────────────────────────────────────── */
  .roadmap { display: flex; flex-direction: column; }
  .step { display: flex; gap: 14px; }
  .step .rail { display: flex; flex-direction: column; align-items: center; }
  .step .dot {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 11.5px; font-weight: 700;
    background: var(--accent); color: var(--ink-950);
    box-shadow: 0 0 0 4px var(--accent-dim);
  }
  .step .line { width: 2px; flex: 1; background: linear-gradient(var(--accent), var(--ink-700)); min-height: 14px; margin: 4px 0; }
  .step:last-child .line { display: none; }
  .step .body { padding-bottom: 18px; }
  .step .label { color: var(--ink-100); font-weight: 600; font-size: 14.5px; }
  .step .detail { color: var(--ink-400); font-size: 13px; margin-top: 3px; line-height: 1.5; }

  /* ── Glossary / resources ───────────────────────────── */
  .gloss dt { color: var(--accent-soft); font-weight: 700; font-size: 13.5px; margin-top: 10px; }
  .gloss dd { color: var(--ink-300); font-size: 13.5px; line-height: 1.55; margin-top: 2px; }
  .res-link { display: block; padding: 4px 0; word-break: break-all; }
  .res-src { display: inline-block; font-size: 11px; color: var(--ink-400); border: 1px solid var(--ink-700); border-radius: 99px; padding: 1px 9px; margin-bottom: 8px; }
  .res-desc { font-size: 13.5px; color: var(--ink-300); line-height: 1.55; }

  /* ── Diagram ────────────────────────────────────────── */
  .mermaid-host { display: flex; justify-content: center; padding: 6px 0; overflow-x: auto; }
  .mermaid-host svg { max-width: 100%; height: auto; }
  .diagram-caption { text-align: center; font-size: 12.5px; color: var(--ink-400); margin-top: 8px; font-style: italic; }
  .mindmap-note { text-align: center; color: var(--ink-400); font-size: 13px; margin-bottom: 16px; }

  /* ── Empty / picker states ──────────────────────────── */
  .empty { max-width: 640px; margin: 12vh auto; text-align: center; padding: 0 20px; }
  .empty .big { font-size: 54px; margin-bottom: 18px; }
  .empty h2 { color: var(--ink-100); font-size: 24px; margin-bottom: 10px; font-family: var(--font-display); }
  .empty p { color: var(--ink-400); line-height: 1.7; font-size: 15px; }
  .empty code { background: var(--ink-850); border: 1px solid var(--ink-700); border-radius: 7px; padding: 2px 9px; color: var(--accent-soft); font-size: .9em; }
  .boardlist { margin: 26px auto 0; display: flex; flex-direction: column; gap: 10px; max-width: 460px; }
  .boardlist button {
    display: flex; align-items: center; gap: 12px; text-align: left;
    background: var(--ink-850); border: 1px solid var(--ink-700); border-radius: 12px;
    padding: 13px 16px; color: var(--ink-200); font-size: 14.5px;
  }
  .boardlist button:hover { border-color: var(--accent); }
  .boardlist .bemoji { font-size: 22px; }
  .boardlist .bmeta { font-size: 12px; color: var(--ink-400); }

  .sources { margin-top: 44px; border-top: 1px solid var(--ink-800); padding-top: 20px; }
  .sources h3 { color: var(--ink-400); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 12px; }
  .sources ul { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .sources li { font-size: 13px; }
  .sources .host { color: var(--ink-400); font-size: 11.5px; margin-left: 8px; }

  /* ── Research trail overlay ─────────────────────────── */
  .research-overlay {
    position: fixed; inset: 0; z-index: 80;
    background: color-mix(in srgb, var(--ink-950) 72%, transparent);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 4vh 4vw;
  }
  .research-overlay[hidden] { display: none; }
  .research-panel {
    display: flex; width: min(1200px, 100%); height: 100%;
    background: var(--ink-900); border: 1px solid var(--ink-700);
    border-radius: 16px; overflow: hidden;
  }
  .research-side { width: 300px; flex: none; border-right: 1px solid var(--ink-800); display: flex; flex-direction: column; }
  .research-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; font-weight: 700; color: var(--ink-100);
    border-bottom: 1px solid var(--ink-800); font-size: 14px; font-family: var(--font-display);
  }
  .research-list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .research-list .grp { margin: 10px 6px 4px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-400); }
  .research-list button {
    text-align: left; background: none; border: 0; border-radius: 8px;
    padding: 7px 10px; color: var(--ink-300); font-size: 12.5px; font-family: var(--font-mono);
    word-break: break-all;
  }
  .research-list button:hover { background: var(--ink-850); color: var(--ink-100); }
  .research-list button.active { background: var(--accent-dim); color: var(--accent-soft); }
  .research-list .none { color: var(--ink-400); font-size: 12.5px; padding: 10px; line-height: 1.5; }
  .research-content { flex: 1; overflow-y: auto; padding: 24px 30px; }
  .research-content pre {
    background: var(--ink-950); border: 1px solid var(--ink-800); border-radius: 12px;
    padding: 14px; overflow-x: auto; font-size: 12px; line-height: 1.6; color: var(--ink-300);
    white-space: pre-wrap; word-break: break-word;
  }
  @media (max-width: 760px) { .research-panel { flex-direction: column; } .research-side { width: 100%; max-height: 40%; border-right: 0; border-bottom: 1px solid var(--ink-800); } }

  /* ── Annotations (your notes, saved into the board) ──── */
  .ann { margin-top: 14px; border-top: 1px dashed var(--ink-700); padding-top: 10px; }
  .ann-label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 6px;
  }
  .ann-text { font-size: 13.5px; color: var(--ink-200); line-height: 1.6; font-style: italic; white-space: pre-wrap; }
  .ann-editctl { background: none; border: 0; color: var(--ink-400); font-size: 11px; cursor: pointer; padding: 2px 8px; border-radius: 6px; }
  .ann-editctl:hover { color: var(--accent-soft); background: var(--ink-850); }
  .ann-add { margin-top: 12px; font-size: 11.5px !important; }
  .card:not(:hover) .ann-add { opacity: .3; }
  .ann textarea {
    width: 100%; min-height: 84px; box-sizing: border-box;
    background: var(--ink-950); color: var(--ink-200);
    border: 1px solid var(--ink-700); border-radius: 10px; padding: 10px;
    font: inherit; font-size: 13.5px; resize: vertical;
  }
  .ann textarea:focus { outline: none; border-color: var(--accent); }
  .ann-actions { display: flex; gap: 8px; margin-top: 8px; }
  .ann-actions .btn { font-size: 12px; padding: 5px 12px; }

  /* ── Spaced repetition ─────────────────────────────────── */
  .fc-rate { display: flex; gap: 6px; margin-top: 10px; }
  .fc-rate button { flex: 1; font-size: 12px; padding: 7px 4px; border-radius: 9px; border: 1px solid var(--ink-700); background: var(--ink-850); color: var(--ink-300); }
  .fc-rate .r-again:hover { border-color: var(--coral); color: var(--coral); }
  .fc-rate .r-hard:hover  { border-color: var(--gold);  color: var(--gold); }
  .fc-rate .r-good:hover  { border-color: var(--mint);  color: var(--mint); }
  .fc-rate .r-easy:hover  { border-color: var(--sky);   color: var(--sky); }
  .fc-due { font-size: 11px; color: var(--ink-400); text-align: center; margin-top: 6px; }
  .review-card { max-width: 560px; margin: 0 auto; }
  .review-src { text-align: center; font-size: 12px; color: var(--ink-400); margin-bottom: 12px; }
  .review-done { text-align: center; color: var(--ink-300); padding: 60px 20px; font-size: 16px; }
  .review-done .big { font-size: 44px; margin-bottom: 14px; }

  /* ── What's-new badges ─────────────────────────────────── */
  .chip.newbadge {
    color: var(--mint); font-weight: 700; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; padding: 2px 9px;
    border: 1px solid color-mix(in srgb, var(--mint) 45%, transparent);
    background: color-mix(in srgb, var(--mint) 10%, transparent);
    border-radius: 99px; margin-left: auto;
  }
  .card.is-new { border-color: color-mix(in srgb, var(--mint) 35%, var(--ink-800)); }

  /* ── Cross-board links ─────────────────────────────────── */
  .related { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .related button {
    font-size: 11.5px; border: 1px solid var(--ink-700); background: var(--ink-850);
    color: var(--accent-soft); border-radius: 99px; padding: 3px 11px;
  }
  .related button:hover { border-color: var(--accent); }
  .card.flash-target { box-shadow: 0 0 0 2px var(--accent) !important; }

  /* Embedded (standalone HTML export) mode — no server behind the page. */
  .embedded #boardPicker, .embedded #researchBtn, .embedded #htmlBtn, .embedded #reviewBtn { display: none; }
  .embedded .ann-editctl, .embedded .ann-add, .embedded .related { display: none; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink-800); border: 1px solid var(--accent); color: var(--ink-100);
    border-radius: 12px; padding: 10px 20px; font-size: 13.5px; opacity: 0;
    transition: all .3s ease; z-index: 100; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media print {
    body { background: white !important; color: #111 !important; }
    header, .no-print { display: none !important; }
    .card { border-color: #ddd; background: #fff; box-shadow: none !important; break-inside: avoid; }
    .card h2, .step .label, .md strong, .md h3 { color: #111 !important; }
    .md, .md td, .step .detail { color: #333 !important; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="spark">✦</span> Superlearn <small>learn anything</small></div>
  <select id="boardPicker" title="Switch board" aria-label="Switch board"></select>
  <nav class="views" id="viewSwitch" aria-label="Layout">
    <button data-view="board">Board</button>
    <button data-view="notes">Notes</button>
    <button data-view="grid">Grid</button>
    <button data-view="mindmap">Mindmap</button>
    <button data-view="feed">Feed</button>
  </nav>
  <div class="spacer"></div>
  <input type="search" id="search" placeholder="Filter blocks…" aria-label="Filter blocks" />
  <button class="btn" id="reviewBtn" title="Spaced-repetition review across all boards">Review</button>
  <button class="btn" id="researchBtn" title="Browse the research trail behind this board">Research</button>
  <button class="btn" id="exportBtn" title="Download board JSON">JSON</button>
  <button class="btn" id="htmlBtn" title="Save a self-contained HTML file of this board">HTML</button>
  <button class="btn" id="printBtn" title="Print / save as PDF">Print</button>
</header>

<div id="app"></div>

<div id="researchOverlay" class="research-overlay" hidden>
  <div class="research-panel">
    <div class="research-side">
      <div class="research-head">
        <span>Research trail</span>
        <button id="researchClose" class="btn" aria-label="Close">✕</button>
      </div>
      <div id="researchList" class="research-list"></div>
    </div>
    <div id="researchContent" class="research-content">
      <p class="res-desc">The raw material this board was built from — the plan,
      every synthesized note, and the scraper output. Pick a file.</p>
    </div>
  </div>
</div>

<div id="reviewOverlay" class="research-overlay" hidden>
  <div class="research-panel" style="max-width: 800px; flex-direction: column;">
    <div class="research-head">
      <span id="reviewTitle">Review — due across all boards</span>
      <button id="reviewClose" class="btn" aria-label="Close">✕</button>
    </div>
    <div id="reviewBody" class="research-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════════════
   Superlearn app — vanilla JS, zero build step.
   Boards come from the local server (/api/boards). The board's own
   `theme` decides the page identity; the app hot-reloads whenever the
   running Claude Code session updates the board on disk.
   ════════════════════════════════════════════════════════════════════ */

const THEMES = {
  midnight:  { dark: true },
  blueprint: { dark: true },
  terminal:  { dark: true },
  paper:     { dark: false },
  sepia:     { dark: false },
  arctic:    { dark: false },
};
const HEX = /^#[0-9a-fA-F]{6}$/;
const MODES = new Set(["study", "interview", "research", "documentation"]);

/** Set by export_html.py in standalone files — renders without a server. */
const EMBEDDED = window.SUPERLEARN_EMBEDDED_BOARD ?? null;

const state = {
  boards: [],        // summaries
  board: null,       // full board
  boardRaw: "",      // serialized board for change detection
  view: "board",
  query: "",
};

const $ = (sel, el = document) => el.querySelector(sel);
const app = $("#app");

/* ── Safe HTML helpers ─────────────────────────────────────────────── */

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

/**
 * Boards are shareable files, so their URLs are untrusted input: a hostile
 * board could set a resource/source url to `javascript:…` and turn a normal
 * click into script execution. Anything that isn't plain http(s) is refused.
 */
function safeUrl(u) {
  if (typeof u !== "string") return null;
  try {
    const parsed = new URL(u, window.location.href);
    return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : null;
  } catch {
    return null;
  }
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v; // only ever fed md2html/esc output
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.append(c.nodeType ? c : document.createTextNode(c));
  }
  return node;
}

/* ── Theme application ─────────────────────────────────────────────── */

function applyTheme(theme) {
  const preset = THEMES[theme?.preset] ? theme.preset : "midnight";
  document.documentElement.dataset.theme = preset;
  const root = document.documentElement.style;
  if (theme?.accent && HEX.test(theme.accent)) {
    root.setProperty("--accent", theme.accent);
  } else {
    root.removeProperty("--accent"); // fall back to the preset's accent
  }
}

function currentThemeIsDark() {
  return THEMES[document.documentElement.dataset.theme]?.dark !== false;
}

/* ── Markdown (escape-first, so model output can't inject markup) ──── */

function mdInline(s) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  out = out.replace(
    /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );
  return out;
}

function md2html(src) {
  const lines = String(src ?? "").replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim().startsWith("```")) {
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }

    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) {
      const tag = h[1].length <= 3 ? "h3" : "h4";
      out.push(`<${tag}>${mdInline(h[2])}</${tag}>`);
      i++;
      continue;
    }

    if (line.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${mdInline(buf.join(" "))}</blockquote>`);
      continue;
    }

    if (line.includes("|") && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1] ?? "")) {
      const row = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
      const head = row(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) rows.push(row(lines[i++]));
      out.push(
        `<table><thead><tr>${head.map((c) => `<th>${mdInline(c)}</th>`).join("")}</tr></thead>` +
        `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
      );
      continue;
    }

    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((it) => `<li>${mdInline(it)}</li>`).join("")}</${tag}>`);
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !lines[i].includes("|")
    ) buf.push(lines[i++]);
    out.push(`<p>${mdInline(buf.join(" "))}</p>`);
  }
  return out.join("");
}

/* ── Mermaid (CDN, lazy, theme-aware, graceful fallback) ───────────── */

let mermaidLib = null;
let mermaidLoading = null;
let mermaidThemeKey = "";

function loadMermaid() {
  if (mermaidLib) return Promise.resolve(mermaidLib);
  if (mermaidLoading) return mermaidLoading;
  mermaidLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js";
    s.onload = () => { mermaidLib = window.mermaid; resolve(mermaidLib); };
    s.onerror = () => reject(new Error("mermaid load failed"));
    document.head.appendChild(s);
  });
  return mermaidLoading;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function configureMermaid(m) {
  const key = document.documentElement.dataset.theme + "|" + cssVar("--accent");
  if (key === mermaidThemeKey) return;
  mermaidThemeKey = key;
  const dark = currentThemeIsDark();
  m.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: dark ? "dark" : "default",
    fontFamily: "inherit",
    themeVariables: {
      background: cssVar("--ink-900"),
      primaryColor: cssVar("--ink-800"),
      primaryTextColor: cssVar("--ink-100"),
      primaryBorderColor: cssVar("--accent"),
      lineColor: cssVar("--ink-400"),
      secondaryColor: cssVar("--ink-850"),
      tertiaryColor: cssVar("--ink-850"),
    },
  });
}

let mermaidSeq = 0;
function renderMermaid(host, source) {
  loadMermaid()
    .then((m) => { configureMermaid(m); return m.render(`mmd${++mermaidSeq}`, source); })
    .then(({ svg }) => { host.innerHTML = svg; })
    .catch(() => {
      host.innerHTML = `<pre style="width:100%;overflow-x:auto;background:var(--ink-950);border:1px solid var(--ink-800);border-radius:12px;padding:14px;font-size:12px;color:var(--ink-300)"><code>${esc(source)}</code></pre>`;
    });
}

/* ── Progress (localStorage, per board) ────────────────────────────── */

function progressKeyFor(id) { return `superlearn.progress.${id}`; }
function loadProgressFor(id) {
  try { return JSON.parse(localStorage.getItem(progressKeyFor(id))) ?? {}; }
  catch { return {}; }
}
function saveProgressFor(id, p) { localStorage.setItem(progressKeyFor(id), JSON.stringify(p)); }

/* ── Spaced repetition (SM-2-lite) ─────────────────────────────────── */

const DAY = 86400000;

function srsKey(blockKey, front) { return `${blockKey}|${front}`; }

function srsState(progress, key) {
  return progress.srs?.[key] ?? { ef: 2.5, iv: 0, reps: 0, due: 0 };
}

/** One review: rating ∈ again|hard|good|easy → next interval + due date. */
function srsRate(s, rating) {
  const n = { ...s };
  if (rating === "again") {
    n.reps = 0; n.iv = 0;
    n.ef = Math.max(1.3, n.ef - 0.2);
    n.due = Date.now() + 10 * 60 * 1000;            // retry in ~10 minutes
  } else if (rating === "hard") {
    n.iv = Math.max(1, (n.iv || 1) * 1.2);
    n.ef = Math.max(1.3, n.ef - 0.15);
    n.reps += 1; n.due = Date.now() + n.iv * DAY;
  } else if (rating === "good") {
    n.iv = n.reps === 0 ? 1 : Math.max(1, (n.iv || 1) * n.ef);
    n.reps += 1; n.due = Date.now() + n.iv * DAY;
  } else {                                           // easy
    n.iv = n.reps === 0 ? 2.5 : Math.max(2, (n.iv || 1) * n.ef * 1.3);
    n.ef = Math.min(3, n.ef + 0.15);
    n.reps += 1; n.due = Date.now() + n.iv * DAY;
  }
  n.iv = Math.round(n.iv * 10) / 10;
  return n;
}

function saveSrs(boardId, key, s) {
  const p = loadProgressFor(boardId);
  p.srs = p.srs ?? {};
  p.srs[key] = s;
  saveProgressFor(boardId, p);
}

function dueText(s) {
  if (!s.reps && !s.due) return "new";
  const ms = s.due - Date.now();
  if (ms <= 0) return "due now";
  if (ms < DAY) return "due in <1d";
  return `due in ${Math.round(ms / DAY)}d`;
}

/* ── What's-new detection (per board, per browser) ─────────────────── */

function sigOf(block) {
  const { annotation, ...rest } = block;   // your notes never mark a card "updated"
  return JSON.stringify(rest);
}

function computeNewBadges(board) {
  const key = `superlearn.seen.${board.id}`;
  let prev = [];
  try { prev = JSON.parse(localStorage.getItem(key)) ?? []; } catch { /* first visit */ }
  const sigs = board.blocks.map(sigOf);
  state.newSigs = new Set(prev.length ? sigs.filter((s) => !prev.includes(s)) : []);
  try { localStorage.setItem(key, JSON.stringify(sigs)); } catch { /* storage full */ }
}

/* ── Block renderers ───────────────────────────────────────────────── */

const KICKERS = {
  summary: ["◎", "Overview"], concept: ["◆", "Concept"], note: ["✎", "Note"],
  video: ["▶", "Watch"], diagram: ["⬡", "Diagram"], code: ["⌘", "Code"],
  flashcards: ["⧉", "Recall"], resource: ["↗", "Go deeper"],
  roadmap: ["⚑", "Plan"], glossary: ["✱", "Glossary"],
};
const ACCENTS = ["var(--accent)", "var(--coral)", "var(--mint)", "var(--gold)", "var(--sky)"];

function renderBlock(block, index) {
  const [icon, label] = KICKERS[block.type] ?? ["•", block.type];
  const isNew = state.newSigs?.has(sigOf(block));
  const card = el("article", {
    class: "card" + (isNew ? " is-new" : ""),
    style: `--card-accent:${ACCENTS[index % ACCENTS.length]}; animation-delay:${Math.min(index * 45, 500)}ms`,
    "data-type": block.type,
  });
  const kicker = el("div", { class: "kicker" }, [`${icon} ${label}`]);
  if (isNew) kicker.append(el("span", { class: "chip newbadge" }, ["updated"]));
  card.append(kicker);
  card.append(el("h2", {}, [block.title ?? ""]));

  switch (block.type) {
    case "summary": case "note":
      card.append(el("div", { class: "md", html: md2html(block.markdown) }));
      break;

    case "concept":
      if (block.tagline) card.append(el("p", { class: "tagline" }, [`“${block.tagline}”`]));
      card.append(el("div", { class: "md", html: md2html(block.markdown) }));
      break;

    case "video": card.append(renderVideo(block)); break;
    case "diagram": {
      const host = el("div", { class: "mermaid-host" }, ["Rendering diagram…"]);
      card.append(host);
      renderMermaid(host, block.mermaid ?? "");
      if (block.caption) card.append(el("div", { class: "diagram-caption" }, [block.caption]));
      break;
    }
    case "code": card.append(renderCode(block)); break;
    case "flashcards": card.append(renderFlashcards(block)); break;

    case "resource": {
      const href = safeUrl(block.url);
      card.append(el("span", { class: "res-src" }, [block.source ?? hostOf(block.url)]));
      card.append(
        href
          ? el("a", { class: "res-link", href, target: "_blank", rel: "noopener noreferrer" }, [href])
          : el("p", { class: "res-link", title: "Only http(s) links are opened" }, [`⚠ unsupported link: ${block.url ?? ""}`]),
      );
      if (block.description) card.append(el("p", { class: "res-desc" }, [block.description]));
      break;
    }

    case "roadmap": {
      const wrap = el("div", { class: "roadmap" });
      (block.steps ?? []).forEach((s, si) => {
        wrap.append(el("div", { class: "step" }, [
          el("div", { class: "rail" }, [el("div", { class: "dot" }, [String(si + 1)]), el("div", { class: "line" })]),
          el("div", { class: "body" }, [
            el("div", { class: "label" }, [s.label ?? ""]),
            s.detail ? el("div", { class: "detail" }, [s.detail]) : null,
          ]),
        ]));
      });
      card.append(wrap);
      break;
    }

    case "glossary": {
      const dl = el("dl", { class: "gloss" });
      for (const e of block.entries ?? []) {
        dl.append(el("dt", {}, [e.term ?? ""]));
        dl.append(el("dd", {}, [e.definition ?? ""]));
      }
      card.append(dl);
      break;
    }

    default:
      if (block.markdown) card.append(el("div", { class: "md", html: md2html(block.markdown) }));
  }

  card.append(renderRelated(block));
  card.append(renderAnnotation(block));
  return card;
}

/* ── Cross-board links ─────────────────────────────────────────────── */

function renderRelated(block) {
  const wrap = el("div");
  if (!Array.isArray(block.related) || block.related.length === 0) return wrap;
  const row = el("div", { class: "related no-print" });
  for (const r of block.related) {
    if (!r || typeof r.board !== "string") continue;
    const target = state.boards.find((b) => b.id === r.board);
    const text = r.label ?? `${target?.emoji ?? "↪"} ${r.block ?? target?.title ?? r.board}`;
    const btn = el("button", { title: `Open ${r.board}${r.block ? " → " + r.block : ""}` }, [`↪ ${text}`]);
    btn.addEventListener("click", () => navigateRelated(r));
    row.append(btn);
  }
  if (row.childNodes.length) wrap.append(row);
  return wrap;
}

async function navigateRelated(r) {
  if (EMBEDDED) return;
  if (!state.boards.some((b) => b.id === r.board)) {
    toast("That board isn't on this server yet");
    return;
  }
  await selectBoard(r.board);
  if (!r.block) return;
  setTimeout(() => {
    const heading = [...document.querySelectorAll("article.card h2")]
      .find((h) => h.textContent.trim() === r.block);
    const target = heading?.closest(".card");
    if (!target) return;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.add("flash-target");
    setTimeout(() => target.classList.remove("flash-target"), 2000);
  }, 300);
}

/* ── Annotations — your own notes, saved into the board JSON ───────── */

function renderAnnotation(block) {
  const wrap = el("div");

  const editor = (initial) => {
    wrap.innerHTML = "";
    const box = el("div", { class: "ann" });
    box.append(el("div", { class: "ann-label" }, ["Your note"]));
    const ta = el("textarea", { placeholder: "Your own words — confusions, connections, aha-moments. Saved into the board itself." });
    ta.value = initial;
    box.append(ta);
    const actions = el("div", { class: "ann-actions no-print" });
    const save = el("button", { class: "btn" }, ["Save"]);
    const cancel = el("button", { class: "btn" }, ["Cancel"]);
    save.addEventListener("click", () => saveAnnotation(block, ta.value.trim()));
    cancel.addEventListener("click", () => { wrap.innerHTML = ""; wrap.append(display()); });
    actions.append(save, cancel);
    if (initial) {
      const del = el("button", { class: "btn" }, ["Delete note"]);
      del.addEventListener("click", () => saveAnnotation(block, ""));
      actions.append(del);
    }
    box.append(actions);
    ta.focus();
    return box;
  };

  const display = () => {
    if (block.annotation) {
      const box = el("div", { class: "ann" });
      const labelRow = el("div", { class: "ann-label" }, ["Your note"]);
      const edit = el("button", { class: "ann-editctl no-print" }, ["edit"]);
      edit.addEventListener("click", () => { wrap.innerHTML = ""; wrap.append(editor(block.annotation)); });
      labelRow.append(edit);
      box.append(labelRow);
      box.append(el("div", { class: "ann-text" }, [block.annotation]));
      return box;
    }
    const add = el("button", { class: "btn ann-add ann-editctl no-print" }, ["✎ Add note"]);
    add.addEventListener("click", () => { wrap.innerHTML = ""; wrap.append(editor("")); });
    return add;
  };

  wrap.append(display());
  return wrap;
}

/** Merge the annotation into the freshest board on disk, then PUT — so a
    note never clobbers edits Claude made since this page loaded. */
async function saveAnnotation(block, text) {
  if (EMBEDDED || !state.board) return;
  try {
    const res = await fetch(`/api/boards/${encodeURIComponent(state.board.id)}`);
    if (!res.ok) throw new Error();
    const fresh = await res.json();
    const match = (fresh.blocks ?? []).find(
      (b) => b.type === block.type && b.title === block.title,
    );
    if (!match) throw new Error();
    if (text) match.annotation = text;
    else delete match.annotation;

    const put = await fetch(`/api/boards/${encodeURIComponent(state.board.id)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fresh),
    });
    if (!put.ok) throw new Error();

    const scrollY = window.scrollY;
    state.board = fresh;
    state.boardRaw = JSON.stringify(fresh);
    render();
    window.scrollTo({ top: scrollY });
    toast(text ? "Note saved into the board" : "Note removed");
  } catch {
    toast("Couldn't save the note");
  }
}

function renderFlashcards(block) {
  const cards = block.cards ?? [];
  const blockKey = block.id ?? block.title;
  const boardId = state.board?.id ?? "none";
  const wrap = el("div");
  if (cards.length === 0) return wrap;

  let idx = 0;
  let flipped = false;

  const scene = el("div", { class: "fc-scene" });
  const cardEl = el("div", { class: "fc-card", role: "button", tabindex: "0", "aria-label": "Flip card" });
  const front = el("div", { class: "fc-face fc-front" });
  const back = el("div", { class: "fc-face fc-back" });
  cardEl.append(front, back);
  scene.append(cardEl);

  const count = el("span", { class: "count" });
  const dueLine = el("div", { class: "fc-due" });
  const prev = el("button", { class: "btn" }, ["‹"]);
  const next = el("button", { class: "btn" }, ["›"]);
  const shuffle = el("button", { class: "btn" }, ["Shuffle"]);
  const tsv = el("button", { class: "btn", title: "Export deck as tab-separated values — imports straight into Anki" }, ["Anki"]);

  const rateRow = el("div", { class: "fc-rate no-print" });
  const ratings = [["again", "Again"], ["hard", "Hard"], ["good", "Good"], ["easy", "Easy"]];
  for (const [rating, label] of ratings) {
    const b = el("button", { class: `r-${rating}` }, [label]);
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const c = cards[idx];
      const k = srsKey(blockKey, c.front);
      const s = srsRate(srsState(loadProgressFor(boardId), k), rating);
      saveSrs(boardId, k, s);
      // advance to the next due card if any, else just the next card
      const nextDue = cards.findIndex((cc, i) =>
        i !== idx && (srsState(loadProgressFor(boardId), srsKey(blockKey, cc.front)).due ?? 0) <= Date.now());
      idx = nextDue >= 0 ? nextDue : (idx + 1) % cards.length;
      flipped = false;
      update();
      updateReviewBadge();
    });
    rateRow.append(b);
  }

  const update = () => {
    const c = cards[idx];
    const p = loadProgressFor(boardId);
    const s = srsState(p, srsKey(blockKey, c.front));
    front.textContent = c.front;
    back.textContent = c.back;
    cardEl.classList.toggle("flipped", flipped);
    rateRow.style.display = flipped ? "flex" : "none";
    const due = cards.filter((cc) => (srsState(p, srsKey(blockKey, cc.front)).due ?? 0) <= Date.now()).length;
    count.textContent = `${idx + 1} / ${cards.length} · ${due} due`;
    dueLine.textContent = `this card: ${dueText(s)}${s.reps ? ` · interval ${s.iv}d` : ""}`;
  };

  const flip = () => { flipped = !flipped; update(); };
  cardEl.addEventListener("click", flip);
  cardEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
  prev.addEventListener("click", () => { idx = (idx - 1 + cards.length) % cards.length; flipped = false; update(); });
  next.addEventListener("click", () => { idx = (idx + 1) % cards.length; flipped = false; update(); });
  shuffle.addEventListener("click", () => {
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    idx = 0; flipped = false; update();
  });
  tsv.addEventListener("click", () => exportDeckTsv(block));

  wrap.append(scene);
  wrap.append(el("div", { class: "fc-hint" }, ["click card to flip · rate after flipping"]));
  wrap.append(rateRow);
  wrap.append(dueLine);
  wrap.append(el("div", { class: "fc-nav no-print" }, [
    el("div", { class: "grp" }, [prev, next, shuffle, tsv]),
    count,
  ]));
  update();
  return wrap;
}

/** Tab-separated export — File → Import in Anki picks it up directly. */
function exportDeckTsv(block) {
  const clean = (s) => String(s ?? "").replace(/[\t\n\r]+/g, " ").trim();
  const lines = (block.cards ?? []).map((c) => `${clean(c.front)}\t${clean(c.back)}`);
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/tab-separated-values" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${state.board?.id ?? "deck"}-flashcards.tsv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Deck exported — import the .tsv straight into Anki");
}

function visibleBlocks() {
  const q = state.query.trim().toLowerCase();
  // "quiz" blocks from older boards are ignored — Superlearn is depth-first.
  let blocks = (state.board?.blocks ?? []).filter((b) => b.type !== "quiz");
  if (q) {
    blocks = blocks.filter((b) => JSON.stringify(b).toLowerCase().includes(q));
  }
  return blocks;
}

/** Auto-generated whole-board mindmap from block structure. */
function overviewMindmap(board) {
  const safe = (s) => String(s ?? "").replace(/[(){}\[\]"`]/g, "").slice(0, 40).trim() || "…";
  const lines = ["mindmap", `  root((${safe(board.title)}))`];
  const groups = {
    Concepts: board.blocks.filter((b) => b.type === "concept"),
    Practice: board.blocks.filter((b) => ["flashcards", "code"].includes(b.type)),
    Watch: board.blocks.filter((b) => b.type === "video"),
    Read: board.blocks.filter((b) => b.type === "resource"),
  };
  for (const [label, blocks] of Object.entries(groups)) {
    if (blocks.length === 0) continue;
    lines.push(`    ${label}`);
    for (const b of blocks.slice(0, 8)) lines.push(`      ${safe(b.title)}`);
  }
  const roadmap = board.blocks.find((b) => b.type === "roadmap");
  if (roadmap) {
    lines.push("    Path");
    for (const s of (roadmap.steps ?? []).slice(0, 8)) lines.push(`      ${safe(s.label)}`);
  }
  return lines.join("\n");
}

function render() {
  app.innerHTML = "";

  if (!state.board) { renderEmpty(); return; }
  const board = state.board;

  // Hero
  const hero = el("div", { class: "hero" });
  const h1 = el("h1");
  h1.append(el("span", { class: "emoji" }, [board.emoji ?? "🧠"]), board.title ?? board.topic);
  hero.append(h1);
  const meta = el("div", { class: "meta" });
  meta.append(el("span", { class: "chip accent" }, [board.topic ?? ""]));
  meta.append(el("span", { class: "chip" }, [MODES.has(board.mode) ? board.mode : "study"]));
  if (board.depth) meta.append(el("span", { class: "chip" }, [board.depth]));
  meta.append(el("span", { class: "chip" }, [`${visibleBlocks().length || board.blocks.length} blocks`]));
  if (board.createdAt) meta.append(el("span", {}, [new Date(board.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })]));
  hero.append(meta);
  app.append(hero);

  const main = el("main");
  const blocks = visibleBlocks();

  if (state.view === "mindmap") {
    main.append(el("p", { class: "mindmap-note" }, ["The whole territory at a glance — auto-mapped from your board, plus every diagram."]));
    const auto = el("article", { class: "card", style: "--card-accent:var(--accent)" });
    auto.append(el("div", { class: "kicker" }, ["⬡ Overview map"]));
    const host = el("div", { class: "mermaid-host" }, ["Rendering map…"]);
    auto.append(host);
    renderMermaid(host, overviewMindmap(board));
    const flow = el("div", { class: "feedflow" });
    flow.append(auto);
    for (const [i, b] of blocks.entries()) {
      if (b.type === "diagram") flow.append(renderBlock(b, i + 1));
    }
    main.append(flow);
  } else {
    const containerClass = { board: "masonry", notes: "notesflow", grid: "gridflow", feed: "feedflow" }[state.view] ?? "masonry";
    const container = el("div", { class: containerClass });
    let list = blocks;
    if (state.view === "notes") {
      // Document order: summary → roadmap → everything except videos/resources → then those.
      const rank = (b) => ({ summary: 0, roadmap: 1 }[b.type] ?? (["video", "resource"].includes(b.type) ? 3 : 2));
      list = [...blocks].sort((a, b) => rank(a) - rank(b));
    }
    list.forEach((b, i) => container.append(renderBlock(b, i)));
    main.append(container);

    if (blocks.length === 0) {
      main.append(el("div", { class: "empty" }, [
        el("div", { class: "big" }, ["🔍"]),
        el("h2", {}, ["No blocks match"]),
        el("p", {}, [`Nothing on this board matches “${state.query}”.`]),
      ]));
    }
  }

  // Sources
  if ((board.sources ?? []).length > 0 && !state.query) {
    const src = el("section", { class: "sources" });
    src.append(el("h3", {}, ["Research sources"]));
    const ul = el("ul");
    for (const s of board.sources) {
      const href = safeUrl(s.url);
      const li = el("li");
      li.append(
        href
          ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, [s.title ?? href])
          : el("span", {}, [`⚠ ${s.title ?? s.url ?? ""} (unsupported link)`]),
      );
      li.append(el("span", { class: "host" }, [hostOf(s.url)]));
      ul.append(li);
    }
    src.append(ul);
    main.append(src);
  }

  app.append(main);
  syncChrome();
}

/** Every flashcard due (or never studied) across every board on the server. */
async function collectDueCards() {
  const due = [];
  for (const summary of state.boards) {
    let board = state.board?.id === summary.id ? state.board : null;
    if (!board) {
      try {
        const res = await fetch(`/api/boards/${encodeURIComponent(summary.id)}`);
        if (!res.ok) continue;
        board = await res.json();
      } catch { continue; }
    }
    const p = loadProgressFor(board.id);
    for (const block of board.blocks ?? []) {
      if (block.type !== "flashcards") continue;
      const blockKey = block.id ?? block.title;
      for (const c of block.cards ?? []) {
        const k = srsKey(blockKey, c.front);
        if ((srsState(p, k).due ?? 0) <= Date.now()) {
          due.push({
            boardId: board.id, boardTitle: board.title, emoji: board.emoji ?? "🧠",
            key: k, front: c.front, back: c.back,
          });
        }
      }
    }
  }
  return due;
}

async function updateReviewBadge() {
  if (EMBEDDED) return;
  try {
    const due = await collectDueCards();
    $("#reviewBtn").textContent = due.length ? `Review · ${due.length}` : "Review";
  } catch { /* server briefly away */ }
}

async function openReview() {
  const body = $("#reviewBody");
  body.innerHTML = "";
  reviewOverlay.hidden = false;
  body.append(el("p", { class: "res-desc" }, ["Collecting due cards across your boards…"]));
  const queue = await collectDueCards();
  // interleave boards so one deck doesn't monopolize the session
  queue.sort(() => Math.random() - 0.5);
  renderReviewCard(queue);
}

function renderReviewCard(queue) {
  const body = $("#reviewBody");
  body.innerHTML = "";
  $("#reviewTitle").textContent = `Review — ${queue.length} card(s) due`;

  if (queue.length === 0) {
    body.append(el("div", { class: "review-done" }, [
      el("div", { class: "big" }, ["✦"]),
      el("div", {}, ["All caught up. Every card across every board is scheduled in the future."]),
    ]));
    return;
  }

  const item = queue[0];
  let flipped = false;

  const wrap = el("div", { class: "review-card" });
  wrap.append(el("div", { class: "review-src" }, [`${item.emoji} ${item.boardTitle}`]));

  const scene = el("div", { class: "fc-scene" });
  const cardEl = el("div", { class: "fc-card", role: "button", tabindex: "0" });
  const front = el("div", { class: "fc-face fc-front" }, [item.front]);
  const back = el("div", { class: "fc-face fc-back" }, [item.back]);
  cardEl.append(front, back);
  scene.append(cardEl);
  wrap.append(scene);
  wrap.append(el("div", { class: "fc-hint" }, ["click to reveal · then rate your recall"]));

  const rateRow = el("div", { class: "fc-rate", style: "display:none" });
  for (const [rating, label] of [["again", "Again"], ["hard", "Hard"], ["good", "Good"], ["easy", "Easy"]]) {
    const b = el("button", { class: `r-${rating}` }, [label]);
    b.addEventListener("click", () => {
      const s = srsRate(srsState(loadProgressFor(item.boardId), item.key), rating);
      saveSrs(item.boardId, item.key, s);
      const rest = queue.slice(1);
      if (rating === "again") rest.push(item);   // failed cards come back this session
      renderReviewCard(rest);
    });
    rateRow.append(b);
  }
  wrap.append(rateRow);

  const flip = () => {
    flipped = !flipped;
    cardEl.classList.toggle("flipped", flipped);
    rateRow.style.display = flipped ? "flex" : "none";
  };
  cardEl.addEventListener("click", flip);
  cardEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });

  body.append(wrap);
}

async function openResearch() {
  const list = $("#researchList");
  list.innerHTML = "";
  researchOverlay.hidden = false;
  let files = [];
  try {
    const res = await fetch("/api/research");
    files = (await res.json()).files ?? [];
  } catch {
    // fall through to empty state
  }
  if (files.length === 0) {
    list.append(el("div", { class: "none" }, [
      "No research files found. The trail lives in .superlearn/research/ and fills up as boards are built.",
    ]));
    return;
  }

  const groups = { "": [], notes: [], raw: [] };
  for (const f of files) {
    const top = f.path.includes("/") ? f.path.split("/")[0] : "";
    (groups[top] ?? (groups[top] = [])).push(f);
  }
  const order = [["", "Plan"], ["notes", "Synthesized notes"], ["raw", "Scraper output"]];
  const rendered = new Set(order.map(([k]) => k));
  for (const key of Object.keys(groups)) if (!rendered.has(key)) order.push([key, key]);

  for (const [key, label] of order) {
    const bucket = groups[key] ?? [];
    if (bucket.length === 0) continue;
    list.append(el("div", { class: "grp" }, [label]));
    for (const f of bucket) {
      const btn = el("button", {}, [`${f.path}  ·  ${(f.size / 1024).toFixed(1)}kb`]);
      btn.addEventListener("click", () => showResearchFile(f.path, btn));
      list.append(btn);
    }
  }
}

async function showResearchFile(path, btn) {
  for (const b of $("#researchList").querySelectorAll("button")) b.classList.remove("active");
  btn.classList.add("active");
  const content = $("#researchContent");
  content.innerHTML = "";
  try {
    const res = await fetch(`/api/research/file?path=${encodeURIComponent(path)}`);
    if (!res.ok) throw new Error();
    const text = await res.text();
    if (path.endsWith(".md")) {
      content.append(el("div", { class: "md", html: md2html(text) }));
    } else if (path.endsWith(".json")) {
      let pretty = text;
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch { /* keep raw */ }
      content.append(el("pre", {}, [pretty]));
    } else {
      content.append(el("pre", {}, [text]));
    }
  } catch {
    content.append(el("p", { class: "res-desc" }, ["Couldn't load that file."]));
  }
}

/* ── Live updates from the Claude Code session ─────────────────────── */

async function pollForUpdates() {
  const beforeList = JSON.stringify(state.boards.map((b) => b.id));
  await fetchBoards();
  const afterList = JSON.stringify(state.boards.map((b) => b.id));

  if (beforeList !== afterList) {
    syncChrome();
    if (!state.board && state.boards.length > 0) {
      selectBoard(state.boards[0].id);
      return;
    }
    toast("New board available — check the picker");
  }

  // Hot-reload the open board when Claude Code updates it on disk.
  if (state.board) {
    try {
      const res = await fetch(`/api/boards/${encodeURIComponent(state.board.id)}`);
      if (!res.ok) return;
      const fresh = await res.json();
      const freshRaw = JSON.stringify(fresh);
      if (freshRaw !== state.boardRaw) {
        const scrollY = window.scrollY;
        state.board = fresh;
        state.boardRaw = freshRaw;
        applyTheme(fresh.theme);
        computeNewBadges(fresh);
        render();
        window.scrollTo({ top: scrollY });
        toast("✦ Board updated with new material");
      }
    } catch {
      // server briefly unreachable — try again next tick
    }
  }
}

/* ── Boot ──────────────────────────────────────────────────────────── */

(async function boot() {
  if (EMBEDDED) {
    // Standalone HTML export: one baked-in board, no server, no polling.
    document.body.classList.add("embedded");
    state.boards = [{
      id: EMBEDDED.id, title: EMBEDDED.title, emoji: EMBEDDED.emoji,
      topic: EMBEDDED.topic, blockCount: (EMBEDDED.blocks ?? []).length,
    }];
    state.board = EMBEDDED;
    state.boardRaw = JSON.stringify(EMBEDDED);
    state.view = EMBEDDED.layout ?? "board";
    applyTheme(EMBEDDED.theme);
    computeNewBadges(EMBEDDED);
    render();
    return;
  }

  await fetchBoards();
  const { id, view } = initFromHash();
  const target = (id && state.boards.find((b) => b.id === id)) ? id : state.boards[0]?.id;
  if (target) await selectBoard(target, view);
  else render();

  updateReviewBadge();
  setInterval(pollForUpdates, 4000);
})();
</script>
